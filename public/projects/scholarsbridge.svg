<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img"
     aria-label="Education platform interface with course cards, lesson list and checkout panel">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1020" />
      <stop offset="0.5" stop-color="#161029" />
      <stop offset="1" stop-color="#0a0d18" />
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c04de" stop-opacity="0.75" />
      <stop offset="1" stop-color="#54d5ff" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="thumb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e5bff" stop-opacity="0.7" />
      <stop offset="1" stop-color="#b06cff" stop-opacity="0.5" />
    </linearGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#6c04de" stop-opacity="0.4" />
      <stop offset="1" stop-color="#6c04de" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#bg2)" />
  <rect width="1280" height="800" fill="url(#grid2)" />
  <rect width="1280" height="800" fill="url(#glow2)" />

  <!-- header bar -->
  <rect x="60" y="60" width="1160" height="72" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09" />
  <g fill="#ffffff" fill-opacity="0.28">
    <rect x="96" y="88" width="120" height="14" rx="7" />
    <rect x="272" y="90" width="70" height="10" rx="5" />
    <rect x="366" y="90" width="70" height="10" rx="5" />
    <rect x="460" y="90" width="70" height="10" rx="5" />
  </g>
  <rect x="1046" y="82" width="140" height="28" rx="14" fill="#2e5bff" fill-opacity="0.55" stroke="#54d5ff" stroke-opacity="0.5" />

  <!-- course cards -->
  <g>
    <rect x="60" y="168" width="360" height="300" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09" />
    <rect x="60" y="168" width="360" height="156" rx="20" fill="url(#thumb)" />
    <path d="M212 226 l44 24 l-44 24 z" fill="#ffffff" fill-opacity="0.85" />
    <rect x="92" y="356" width="220" height="16" rx="8" fill="#ffffff" fill-opacity="0.45" />
    <rect x="92" y="390" width="160" height="10" rx="5" fill="#ffffff" fill-opacity="0.2" />
    <rect x="92" y="424" width="80" height="22" rx="11" fill="#54d5ff" fill-opacity="0.25" stroke="#54d5ff" stroke-opacity="0.45" />
  </g>
  <g>
    <rect x="460" y="168" width="360" height="300" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09" />
    <rect x="460" y="168" width="360" height="156" rx="20" fill="url(#thumb2)" />
    <path d="M612 226 l44 24 l-44 24 z" fill="#ffffff" fill-opacity="0.85" />
    <rect x="492" y="356" width="190" height="16" rx="8" fill="#ffffff" fill-opacity="0.45" />
    <rect x="492" y="390" width="210" height="10" rx="5" fill="#ffffff" fill-opacity="0.2" />
    <rect x="492" y="424" width="80" height="22" rx="11" fill="#b06cff" fill-opacity="0.25" stroke="#b06cff" stroke-opacity="0.45" />
  </g>

  <!-- checkout panel -->
  <rect x="860" y="168" width="360" height="300" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#54d5ff" stroke-opacity="0.28" />
  <rect x="892" y="204" width="130" height="12" rx="6" fill="#54d5ff" fill-opacity="0.75" />
  <g fill="#ffffff" fill-opacity="0.18">
    <rect x="892" y="246" width="296" height="12" rx="6" />
    <rect x="892" y="280" width="230" height="12" rx="6" />
    <rect x="892" y="314" width="266" height="12" rx="6" />
  </g>
  <line x1="892" y1="356" x2="1188" y2="356" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />
  <rect x="892" y="380" width="110" height="18" rx="9" fill="#ffffff" fill-opacity="0.4" />
  <rect x="892" y="416" width="296" height="34" rx="12" fill="#6c04de" fill-opacity="0.6" stroke="#b06cff" stroke-opacity="0.5" />

  <!-- lesson list -->
  <rect x="60" y="508" width="760" height="232" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
  <g>
    <circle cx="112" cy="558" r="12" fill="none" stroke="#54d5ff" stroke-width="3" />
    <path d="M106 558 l4 4 l8 -9" fill="none" stroke="#54d5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="142" y="551" width="300" height="14" rx="7" fill="#ffffff" fill-opacity="0.3" />
    <rect x="700" y="552" width="80" height="12" rx="6" fill="#ffffff" fill-opacity="0.14" />
  </g>
  <g>
    <circle cx="112" cy="622" r="12" fill="none" stroke="#54d5ff" stroke-width="3" />
    <path d="M106 622 l4 4 l8 -9" fill="none" stroke="#54d5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="142" y="615" width="380" height="14" rx="7" fill="#ffffff" fill-opacity="0.3" />
    <rect x="700" y="616" width="80" height="12" rx="6" fill="#ffffff" fill-opacity="0.14" />
  </g>
  <g>
    <circle cx="112" cy="686" r="12" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />
    <rect x="142" y="679" width="250" height="14" rx="7" fill="#ffffff" fill-opacity="0.16" />
    <rect x="700" y="680" width="80" height="12" rx="6" fill="#ffffff" fill-opacity="0.1" />
  </g>

  <!-- progress -->
  <rect x="860" y="508" width="360" height="232" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
  <circle cx="1040" cy="618" r="66" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="14" />
  <circle cx="1040" cy="618" r="66" fill="none" stroke="#54d5ff" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="290 415" transform="rotate(-90 1040 618)" />
  <rect x="1006" y="608" width="68" height="20" rx="10" fill="#ffffff" fill-opacity="0.45" />
</svg>
