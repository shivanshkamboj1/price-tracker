# nginx site for Pricewatch. Install with __DOMAIN__ replaced by your domain:
#
#   sed "s/__DOMAIN__/$DOMAIN/" deploy/nginx.conf | sudo tee /etc/nginx/sites-available/pricewatch
#
# then run certbot, which adds the HTTPS server block and the redirect.
# HTTPS is required: production session cookies are `Secure`.

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  # The built client, copied here by deploy/update.sh.
  root /var/www/pricewatch;
  index index.html;
  client_max_body_size 1m;

  # Hashed asset filenames are safe to cache for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The API lives on the same origin so cookies stay first-party. One proxy hop,
  # which is what Express's `trust proxy 1` expects.
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    proxy_pass http://127.0.0.1:4000;
  }

  # Single-page app: unknown paths fall through to the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
